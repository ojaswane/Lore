[package]
name = "Lore"
version = "0.1.0"
edition = "2024"
name = "mini-embed"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm"] }
color-eyre = "0.6"
crossterm = "0.29.0"
portable-pty = "0.9.0"
anyhow = "1"
vt100 = "0.16.2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
chrono = "0.4"      # for timestamps
uuid = { version = "1.0", features = ["v4"] }  # for session ids
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
candle-core = "0.8.2"
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
tokenizers = "0.21"


[[bin]]
name = "Lore"
path = "main.rs"
