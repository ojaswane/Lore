[package]
name = "Lore"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm"] }
color-eyre = "0.6"
crossterm = "0.29.0"
portable-pty = "0.9.0"
anyhow = "1"
vt100 = "0.16.2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
chrono = "0.4"      # for timestamps
uuid = { version = "1.0", features = ["v4"] }  # for session ids
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }  # asynchronous runtime
candle-core = { git = "https://github.com/huggingface/candle.git", version = "0.11.0", features = ["cuda"] }


[[bin]]
name = "Lore"
path = "main.rs"
